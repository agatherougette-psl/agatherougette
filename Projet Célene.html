<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Célene — Agathe Rougette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Déclaration de la police personnalisée */
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Fond de page entièrement blanc */
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
        }

        /* Header avec son fond jaune conservé */
        header {
            background-color: #ECF244;
        }

        /* Liens du menu avec survol rose #FA378F */
        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }

        /* Titre principal overlay en gros caractères */
        .project-hero-title {
            font-size: clamp(3.5rem, 9vw, 9rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.03em;
            color: #000000;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

    <!-- Header Navigation (Fond Jaune #ECF244 intact) -->
    <header class="w-full px-8 py-6 flex items-center justify-between z-50 shadow-sm">
        <div class="flex items-center gap-3">
            <a href="index.html">
                <img src="header1.gif" alt="Logo Agathe Rougette" class="h-9 w-auto object-contain">
            </a>
            <span class="font-bold text-sm tracking-widest uppercase">Portfolio</span>
        </div>

        <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-widest uppercase">
            <a href="index.html" class="nav-link">Menu</a>
            <a href="#" class="nav-link">À propos</a>
        </nav>

        <button class="bg-black text-[#FA378F] text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-full shadow-lg hover:bg-[#CC1F6D] hover:text-white transition-colors">
            Me contacter
        </button>
    </header>

    <!-- Main Content (Fond Blanc) -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 py-12 flex flex-col justify-between">
        
        <!-- Composition de style Moodboard / Collage -->
        <div class="relative w-full min-h-[650px] md:min-h-[750px] flex items-center justify-center my-4">

            <!-- 1. Image en haut à gauche -->
            <div class="absolute top-0 left-2 md:left-8 w-32 md:w-48 z-10 shadow-md">
                <img src="projet1.png" alt="Visuel 1" class="w-full h-auto object-cover">
            </div>

            <!-- 2. Grande Image centrale au fond -->
            <div class="absolute top-4 md:top-6 left-1/2 -translate-x-1/2 w-64 md:w-[380px] z-0 shadow-lg">
                <img src="projet2.png" alt="Visuel central" class="w-full h-auto object-cover">
            </div>

            <!-- 3. Portrait en haut à droite -->
            <div class="absolute top-0 right-2 md:right-8 w-40 md:w-60 z-10 shadow-md">
                <img src="projet4.png" alt="Visuel haut droit" class="w-full h-auto object-cover">
            </div>

            <!-- 4. Grand Titre superposé au milieu -->
            <div class="absolute z-20 text-center w-full px-4">
                <h1 class="project-hero-title drop-shadow-sm">Projet Célene</h1>
            </div>

            <!-- 5. Image en bas à gauche -->
            <div class="absolute bottom-6 left-6 md:left-16 w-36 md:w-56 z-30 shadow-md">
                <img src="projet1.png" alt="Visuel bas gauche" class="w-full h-auto object-cover">
            </div>

            <!-- 6. Groupe d'images juxtaposées en bas à droite -->
            <div class="absolute bottom-4 right-6 md:right-16 flex gap-2 z-30">
                <div class="w-28 md:w-40 shadow-md">
                    <img src="projet3.gif" alt="Visuel bas droit 1" class="w-full h-auto object-cover">
                </div>
                <div class="w-28 md:w-40 shadow-md">
                    <img src="projet4.png" alt="Visuel bas droit 2" class="w-full h-auto object-cover">
                </div>
            </div>

        </div>

        <!-- Description du projet en bas à droite -->
        <div class="w-full flex justify-end mt-8">
            <div class="max-w-md text-xs md:text-sm font-medium leading-relaxed text-zinc-800 text-left md:text-right px-4">
                <p>
                    Ce projet explore les compositions graphiques brutes et les références littéraires à travers une approche éditoriale intime. Travail sur les matières, la typographie et la direction artistique globale.
                </p>
            </div>
        </div>

    </main>

    <!-- Footer simple -->
    <footer class="w-full py-6 text-center text-xs font-bold uppercase tracking-widest text-zinc-400">
        © Agathe Rougette — Tous droits réservés
    </footer>

</body>
</html>
