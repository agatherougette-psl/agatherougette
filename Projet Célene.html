<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Célene — Agathe Rougette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
        }

        header {
            background-color: #ECF244;
        }

        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

    <!-- Header Navigation (Fond Jaune #ECF244) -->
    <header class="w-full px-8 py-5 flex items-center justify-between z-50 shadow-sm shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <a href="index.html">
                <img src="header1.gif" alt="Logo Agathe Rougette" class="h-9 w-auto object-contain">
            </a>
            <span class="font-bold text-sm tracking-widest uppercase">Portfolio</span>
        </div>

        <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-widest uppercase">
            <a href="index.html" class="nav-link">Menu</a>
            <a href="#" class="nav-link">À propos</a>
        </nav>

        <button class="bg-black text-[#FA378F] text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-full shadow-lg hover:bg-[#CC1F6D] hover:text-white transition-colors">
            Me contacter
        </button>
    </header>

    <!-- Main Content (Espace d'exposition avec fil connecté) -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 py-8 relative min-h-[1100px]">
        
        <!-- Canvas SVG du Fil Magenta (#FA378F) qui relie toutes les images -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" preserveAspectRatio="none" viewBox="0 0 1200 1100">
            <!-- Trajet continu du fil rose -->
            <path d="M 170,120 C 170,220 380,240 380,240 C 580,240 680,210 680,210 C 650,420 340,510 340,510 C 340,780 430,790 430,790 C 640,810 740,740 740,740 L 1200,680" 
                  fill="none" 
                  stroke="#FA378F" 
                  stroke-width="5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"/>
        </svg>

        <!-- 1. Logo Maison Célene (Haut Gauche) -->
        <div class="absolute top-6 left-6 md:left-12 w-64 md:w-80 z-20">
            <img src="logorestau.png" alt="Maison Célene" class="w-full h-auto object-contain">
        </div>

        <!-- 2. Texte de Description (Haut Droite) -->
        <div class="absolute top-8 right-6 md:right-12 max-w-xs md:max-w-md text-xs md:text-sm font-semibold text-zinc-800 uppercase tracking-wide leading-relaxed text-right z-20">
            <p>
                Ce projet explore les compositions graphiques brutes et les références littéraires à travers une approche éditoriale intime.
            </p>
        </div>

        <!-- 3. Visuel Menu Dentelle Blanc (Haut Centre) -->
        <div class="absolute top-20 left-1/3 -translate-x-12 w-64 md:w-80 z-20">
            <img src="cartebar.png" alt="Menu Dentelle Blanc" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 4. Visuel Cadre Brun 2 Cartes (Haut Droite) -->
        <div class="absolute top-36 right-6 md:right-12 w-80 md:w-[440px] z-20">
            <img src="carte2celene.png" alt="Cartes Fond Brun" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 5. Visuel Verre Olives / Cocktail (Milieu Gauche) -->
        <div class="absolute top-[420px] left-8 md:left-16 w-64 md:w-80 z-20">
            <img src="projet3.gif" alt="Verre Olives" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 6. Visuel Tablier 1 (Bas Centre) -->
        <div class="absolute top-[580px] left-1/3 md:left-[35%] w-72 md:w-96 z-20">
            <img src="projet1.png" alt="Tablier Visuel 1" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 7. Visuel Tablier 2 (Bas Droite) -->
        <div class="absolute top-[540px] right-6 md:right-12 w-72 md:w-96 z-20">
            <img src="projet4.png" alt="Tablier Visuel 2" class="w-full h-auto object-cover shadow-sm">
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs font-bold uppercase tracking-widest text-zinc-400 border-t border-zinc-100 shrink-0">
        © Agathe Rougette — Tous droits réservés
    </footer>

</body>
</html>
