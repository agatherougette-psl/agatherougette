<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Célene — Agathe Rougette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
        }

        header {
            background-color: #ECF244;
        }

        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

    <!-- Header Navigation (Fond Jaune #ECF244) -->
    <header class="w-full px-6 md:px-8 py-4 md:py-5 flex items-center justify-between z-50 shadow-sm shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <a href="index.html">
                <img src="header1.gif" alt="Logo Agathe Rougette" class="h-8 md:h-9 w-auto object-contain">
            </a>
            <span class="font-bold text-xs md:text-sm tracking-widest uppercase">Portfolio</span>
        </div>

        <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-widest uppercase">
            <a href="index.html" class="nav-link">Menu</a>
            <a href="apropos.html" class="nav-link">À propos</a>
        </nav>

        <a href="mecontacter.html" class="bg-black text-[#FA378F] text-[10px] md:text-xs font-bold uppercase tracking-wider px-4 md:px-6 py-2.5 md:py-3 rounded-full shadow-lg hover:bg-[#CC1F6D] hover:text-white transition-colors inline-block text-center">
            Me contacter
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full py-8 px-6 md:px-0 relative md:min-h-[1100px] flex flex-col items-center gap-8 md:block overflow-hidden">
        
        <!-- Fil SVG Mobile : Tracé expressif et adapté à l'empilement vertical sur smartphone -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-10 md:hidden" preserveAspectRatio="none" viewBox="0 0 400 1200">
            <path d="M 40,60 
                     C 180,180 340,240 320,400 
                     C 300,560 60,640 80,820 
                     C 100,1000 340,1080 200,1160" 
                  fill="none" 
                  stroke="#FA378F" 
                  stroke-width="4" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"/>
        </svg>

        <!-- Canvas SVG Desktop : Tracé d'origine sur grand écran -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-10 hidden md:block" preserveAspectRatio="none" viewBox="0 0 1200 1100">
            <path d="M 160,130 C 160,250 360,250 360,250 C 560,250 780,180 880,260 C 980,340 700,420 400,520 C 250,570 200,720 200,780 C 200,840 450,830 450,830 C 650,830 780,780 780,780 L 1200,720" 
                  fill="none" 
                  stroke="#FA378F" 
                  stroke-width="5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"/>
        </svg>

        <!-- 1. Texte de Description (Haut sur mobile, haut droite sur desktop) -->
        <div class="w-full md:max-w-md md:absolute md:top-8 md:right-8 text-xs md:text-sm font-semibold text-zinc-800 uppercase tracking-wide leading-relaxed text-center md:text-right z-20 order-1">
            <p>
                Ce projet explore les compositions graphiques brutes et les références littéraires à travers une approche éditoriale intime.
            </p>
        </div>

        <!-- 2. Logo Maison Célene (Haut Gauche) -->
        <div class="w-48 self-start md:w-80 md:absolute md:top-6 md:left-8 z-20 order-2">
            <img src="logorestau.png" alt="Maison Célene" class="w-full h-auto object-contain">
        </div>

        <!-- 3. Visuel Menu Dentelle Blanc -->
        <div class="w-64 self-end md:w-80 md:absolute md:top-20 md:left-1/3 md:-translate-x-12 z-20 order-3">
            <img src="cartebar.png" alt="Menu Dentelle Blanc" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 4. Visuel Cadre Brun 2 Cartes -->
        <div class="w-4/5 self-start md:w-[460px] md:absolute md:top-36 md:right-0 z-20 order-4">
            <img src="carte2celene.png" alt="Cartes Fond Brun" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 5. Visuel Livre / Carte -->
        <div class="w-64 self-end md:w-80 md:absolute md:top-[420px] md:left-0 z-20 order-5">
            <img src="mockupcelene.png" alt="Visuel livre" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 6. Visuel Tablier 1 -->
        <div class="w-72 self-start md:w-96 md:absolute md:top-[580px] md:left-[35%] z-20 order-6">
            <img src="projet1.png" alt="Tablier Visuel 1" class="w-full h-auto object-cover shadow-sm">
        </div>

        <!-- 7. Visuel Agatha / Tenue -->
        <div class="w-72 self-end md:w-96 md:absolute md:top-[540px] md:right-0 z-20 order-7">
            <img src="projet4.png" alt="Visuel Agatha Paris" class="w-full h-auto object-cover shadow-sm">
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs font-bold uppercase tracking-widest text-zinc-400 border-t border-zinc-100 shrink-0 bg-white z-20">
        © Agathe Rougette — Tous droits réservés
    </footer>

</body>
</html>
