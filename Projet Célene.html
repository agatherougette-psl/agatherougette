<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Célene — Agathe Rougette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #09090b;
            font-family: sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #ECF244;
        }

        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }
    </style>
</head>
<body class="flex flex-col justify-between h-screen">

    <!-- Header Navigation (Fond Jaune #ECF244) -->
    <header class="w-full px-8 py-4 flex items-center justify-between z-50 shadow-sm shrink-0">
        <div class="flex items-center gap-3">
            <a href="index.html">
                <img src="header1.gif" alt="Logo Agathe Rougette" class="h-8 w-auto object-contain">
            </a>
            <span class="font-bold text-sm tracking-widest uppercase">Portfolio</span>
        </div>

        <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-widest uppercase">
            <a href="index.html" class="nav-link">Menu</a>
            <a href="#" class="nav-link">À propos</a>
        </nav>

        <button class="bg-black text-[#FA378F] text-xs font-bold uppercase tracking-wider px-5 py-2.5 rounded-full shadow-lg hover:bg-[#CC1F6D] hover:text-white transition-colors">
            Me contacter
        </button>
    </header>

    <!-- Main Content (Mise en page selon schéma) -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 relative flex items-center justify-center">
        
        <!-- 1. Image rectangle au-dessus du logo central (Schéma noir) -->
        <div class="absolute top-2 left-1/2 -translate-x-[60%] w-44 md:w-64 z-10">
            <img src="projet2.png" alt="Visuel haut centre" class="w-full h-auto object-cover">
        </div>

        <!-- 2. Logo Central Maison Célene (En dessous du rectangle central) -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[-10%] w-64 md:w-[380px] z-20 pointer-events-none">
            <img src="logorestau.png" alt="Logo central" class="w-full h-auto object-contain">
        </div>

        <!-- 3. Image Haut Gauche (Tablier) -->
        <div class="absolute top-2 left-4 md:left-8 w-44 md:w-60 z-10">
            <img src="projet1.png" alt="Visuel 1" class="w-full h-auto object-cover">
        </div>

        <!-- 4. Image Haut Droite (Dentelle blanche) -->
        <div class="absolute top-2 right-4 md:right-8 w-48 md:w-64 z-10">
            <img src="cartebar.png" alt="Visuel haut droit" class="w-full h-auto object-cover">
        </div>

        <!-- 5. Image Bas Gauche (carte2celene / 2 menus brown) -->
        <div class="absolute bottom-4 left-4 md:left-8 w-56 md:w-72 z-30">
            <img src="carte2celene.png" alt="Visuel bas gauche" class="w-full h-auto object-cover">
        </div>

        <!-- 6. Groupe Bas Droite (Verre cocktail + Tenue Agatha selon schéma rose) -->
        <div class="absolute bottom-4 right-4 md:right-8 flex items-end gap-3 z-30">
            <!-- Image Verre Cocktail (Carré rose) -->
            <div class="w-36 md:w-52">
                <img src="mockupcelene.png" alt="Visuel cocktail verre" class="w-full h-auto object-cover">
            </div>
            <!-- Image Dos Tenue (Cercle rose tout à droite) -->
            <div class="w-36 md:w-52">
                <img src="projet4.png" alt="Visuel tenue agatha" class="w-full h-auto object-cover">
            </div>
        </div>

    </main>

    <!-- Footer & Description -->
    <footer class="w-full px-8 py-3 flex flex-col md:flex-row items-center justify-between border-t border-black/10 shrink-0 text-xs">
        <p class="font-medium text-zinc-700 max-w-lg text-center md:text-left">
            Ce projet explore les compositions graphiques brutes et les références littéraires à travers une approche éditoriale intime.
        </p>
        <p class="font-bold uppercase tracking-widest text-zinc-400 mt-2 md:mt-0">
            © Agathe Rougette
        </p>
    </footer>

</body>
</html>
