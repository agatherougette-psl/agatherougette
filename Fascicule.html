<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fascicule — Agathe Rougette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
        }

        /* Header avec son fond jaune conservé */
        header {
            background-color: #ECF244;
        }

        /* Liens du menu avec survol rose #FA378F */
        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

    <!-- Header Navigation Identique (Fond Jaune #ECF244) -->
    <header class="w-full px-6 md:px-8 py-4 md:py-5 flex items-center justify-between z-50 shadow-sm shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <a href="index.html">
                <img src="header1.gif" alt="Logo Agathe Rougette" class="h-8 md:h-9 w-auto object-contain">
            </a>
            <span class="font-bold text-xs md:text-sm tracking-widest uppercase">Portfolio</span>
        </div>

        <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-widest uppercase">
            <a href="index.html" class="nav-link">Menu</a>
            <a href="apropos.html" class="nav-link">À propos</a>
        </nav>

        <a href="mecontacter.html" class="bg-black text-[#FA378F] text-[10px] md:text-xs font-bold uppercase tracking-wider px-4 md:px-6 py-2.5 md:py-3 rounded-full shadow-lg hover:bg-[#CC1F6D] hover:text-white transition-colors inline-block text-center">
            Me contacter
        </a>
    </header>

    <!-- Main Content : Fluide sur mobile, positionnement d'origine sur desktop (md:) -->
    <main class="flex-1 w-full py-10 px-6 md:px-0 relative md:min-h-[1000px] flex flex-col items-center justify-center gap-8 md:block overflow-hidden">
        
        <!-- Fil SVG Mobile : Adapté au format vertical smartphone -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-10 md:hidden" preserveAspectRatio="none" viewBox="0 0 400 700">
            <path d="M 0,160 C 120,140 280,220 400,190 M 0,520 C 140,610 260,580 400,460" 
                  fill="none" 
                  stroke="#FA378F" 
                  stroke-width="5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"/>
        </svg>

        <!-- Canvas SVG Desktop : Grande boucle sous l'image (inchangée sur ordi) -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-10 hidden md:block" preserveAspectRatio="none" viewBox="0 0 1200 1000">
            <path d="M 0,760 Q 200,850 400,700 T 800,700 T 1200,380" 
                  fill="none" 
                  stroke="#FA378F" 
                  stroke-width="6" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"/>
        </svg>

        <!-- Texte de Description (Centré en haut sur mobile, haut droite sur desktop) -->
        <div class="w-full md:max-w-md md:absolute md:top-8 md:right-20 text-xs md:text-sm font-semibold text-zinc-800 uppercase tracking-wide leading-relaxed text-center md:text-right z-20">
            <p>
                Texte de description
            </p>
        </div>

        <!-- Grande Image Centrale (Fascicule GIF animé en boucle automatique) -->
        <div class="w-full max-w-lg md:max-w-none md:w-[850px] md:absolute md:top-24 md:left-1/2 md:-translate-x-1/2 z-20">
            <img id="fascicule-gif" src="projet3.gif" alt="Maquette Fascicule InDesign" loading="eager" class="w-full h-auto object-cover shadow-sm">
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs font-bold uppercase tracking-widest text-zinc-400 border-t border-zinc-100 shrink-0 bg-white z-20">
        © Agathe Rougette — Tous droits réservés
    </footer>

    <!-- Force la lecture immédiate du GIF sur mobile sans blocage de cache -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const gif = document.getElementById('fascicule-gif');
            if (gif) {
                const currentSrc = gif.src.split('?')[0];
                gif.src = currentSrc + '?t=' + new Date().getTime();
            }
        });
    </script>

</body>
</html>
