<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Me contacter — Agathe Rougette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Déclaration de la police personnalisée */
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ECF244;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top, 0px);
        }

        a:focus-visible, button:focus-visible {
            outline: 3px solid #FA378F;
            outline-offset: 3px;
            border-radius: 4px;
        }

        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }

        .contact-title {
            font-family: 'AchilleusScript', cursive, sans-serif;
            font-size: clamp(3.2rem, 16vw, 7.5rem);
            line-height: 1.05;
            color: #09090b;
        }

        @media (min-width: 768px) {
            .contact-title {
                font-size: clamp(3.5rem, 8.5vw, 7.5rem);
            }
        }

        /* ---------- LA LIGNE ROSE (comme sur les autres pages) ---------- */
        .flow-line {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            z-index: 0;
        }
        .flow-line path {
            fill: none;
            stroke: #FA378F;
            stroke-width: 5px;
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
            /* la ligne se dessine toute seule à l'arrivée */
            stroke-dasharray: 1;
            stroke-dashoffset: 0;
            animation: drawLine 2.4s cubic-bezier(0.55, 0, 0.25, 1) 0.2s backwards;
        }
        @media (min-width: 768px) {
            .flow-line path { stroke-width: 7px; }
        }
        @keyframes drawLine {
            from { stroke-dashoffset: 1; }
        }

        .content-layer { position: relative; z-index: 1; }

        /* Léger halo jaune là où la ligne passe derrière le texte */
        .halo {
            text-shadow:
                0 0 8px #ECF244, 0 0 8px #ECF244,
                0 0 16px #ECF244, 0 0 16px #ECF244;
        }

        /* Le titre arrive en deux temps, un mot après l'autre */
        .word {
            display: inline-block;
            white-space: nowrap;
            animation: wordIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        @keyframes wordIn {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: none; }
        }

        /* Apparition douce */
        .fade-up {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.7s ease-out forwards;
        }
        .fade-up.d2 { animation-delay: 0.8s; }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Soulignement rose qui se dessine au survol / au tap */
        .contact-link {
            background-image: linear-gradient(#FA378F, #FA378F);
            background-repeat: no-repeat;
            background-position: 0 100%;
            background-size: 0% 3px;
            transition: background-size 0.3s ease, color 0.2s ease;
            padding-bottom: 2px;
            overflow-wrap: anywhere;
        }
        .contact-link:hover,
        .contact-link:active {
            color: #FA378F;
            background-size: 100% 3px;
        }

        .copy-btn {
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .copy-btn:hover { transform: scale(1.06); }
        .copy-btn:active { transform: scale(0.94); }
        .copy-btn.is-done {
            background-color: #FA378F;
            color: #09090b;
            transform: scale(1.06);
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up { animation: none; opacity: 1; transform: none; }
            .word, .flow-line path { animation: none; }
        }

        footer {
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

    <!-- Header Navigation : menu visible aussi sur mobile -->
    <header class="w-full px-3 md:px-8 py-4 md:py-6 flex flex-wrap sm:flex-nowrap items-center justify-between gap-y-3 z-50 shrink-0">
        <div class="flex items-center gap-2 md:gap-3 shrink-0">
            <a href="index.html">
                <img src="header1.gif" alt="Logo Agathe Rougette" class="h-7 md:h-9 w-auto object-contain">
            </a>
            <span class="font-bold text-[10px] md:text-sm tracking-widest uppercase">Portfolio</span>
        </div>

        <nav class="flex items-center space-x-3 md:space-x-10 text-[9px] md:text-xs font-bold tracking-widest uppercase shrink-0">
            <a href="index.html" class="nav-link">Menu</a>
            <a href="apropos.html" class="nav-link">À propos</a>
        </nav>

        <a href="mecontacter.html" class="bg-black text-[#FA378F] text-[9px] md:text-xs font-bold uppercase tracking-wider px-3 md:px-6 py-2 md:py-3 rounded-full shadow-lg hover:bg-[#CC1F6D] hover:text-white transition-colors inline-block text-center shrink-0">
            Me contacter
        </a>
    </header>

    <!-- Main Content : diagonale (titre en haut à droite / coordonnées en bas à gauche) -->
    <main class="relative flex-1 w-full px-5 md:px-14 py-10 md:py-20 flex flex-col justify-between gap-16">

        <!-- Ligne rose qui traverse la page, derrière le contenu -->
        <svg class="flow-line" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
            <path pathLength="1" d="M-20 330 C 120 460, 260 500, 420 380 S 640 60, 780 230 S 940 520, 1030 90">
                <!-- la courbe ondule doucement en continu -->
                <animate attributeName="d" dur="10s" repeatCount="indefinite"
                    calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
                    values="M-20 330 C 120 460, 260 500, 420 380 S 640 60, 780 230 S 940 520, 1030 90;
                            M-20 390 C 140 540, 300 460, 440 320 S 620 150, 780 310 S 960 420, 1030 150;
                            M-20 330 C 120 460, 260 500, 420 380 S 640 60, 780 230 S 940 520, 1030 90"/>
            </path>
        </svg>

        <!-- Grand Titre stylisé en haut à droite -->
        <div class="content-layer w-full flex justify-end mt-2 md:mt-10">
            <h1 class="contact-title text-right" id="contact-title">Me contacter</h1>
        </div>

        <!-- Coordonnées en bas à gauche -->
        <div class="content-layer fade-up d2 w-full flex justify-start mb-4 md:mb-16">
            <div class="halo space-y-4 md:space-y-3 text-[15px] md:text-lg font-bold tracking-tight text-[#09090b] max-w-full">

                <div>
                    <p class="flex flex-wrap items-center gap-x-2 gap-y-2">
                        <span>email :</span>
                        <a href="mailto:rougette.agathe9@gmail.com" class="contact-link">rougette.agathe9@gmail.com</a>
                    </p>
                    <button type="button" id="copy-email" class="copy-btn mt-2 bg-black text-[#ECF244] text-[10px] md:text-xs font-bold uppercase tracking-wider px-3 py-1.5 rounded-full hover:bg-[#CC1F6D] hover:text-white">
                        Copier l'adresse
                    </button>
                </div>

                <p class="flex flex-wrap items-center gap-x-2">
                    <span>linkedin :</span>
                    <a href="https://www.linkedin.com/in/agathe-rougette-902255385" target="_blank" rel="noopener noreferrer" class="contact-link underline decoration-2 underline-offset-4">lien ↗</a>
                </p>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full pt-6 px-4 text-center text-[10px] md:text-xs font-bold uppercase tracking-widest text-zinc-600 border-t border-black/10 shrink-0">
        © Agathe Rougette — Tous droits réservés
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* Titre : chaque mot arrive l'un après l'autre (la police reste intacte) */
            const title = document.getElementById('contact-title');
            if (title) {
                const text = title.textContent.trim();
                title.setAttribute('aria-label', text);
                title.textContent = '';
                text.split(' ').forEach((w, i, arr) => {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.setAttribute('aria-hidden', 'true');
                    span.textContent = w;
                    span.style.animationDelay = (0.4 + i * 0.2) + 's';
                    title.appendChild(span);
                    if (i < arr.length - 1) title.appendChild(document.createTextNode(' '));
                });
            }

            /* Bouton "Copier l'adresse" */
            const btn = document.getElementById('copy-email');
            const email = 'rougette.agathe9@gmail.com';
            if (!btn) return;

            const done = () => {
                btn.textContent = 'Copié ✓';
                btn.classList.add('is-done');
                setTimeout(() => {
                    btn.textContent = "Copier l'adresse";
                    btn.classList.remove('is-done');
                }, 1800);
            };

            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(email);
                    done();
                } catch (err) {
                    // Solution de secours pour les navigateurs sans accès au presse-papiers
                    const t = document.createElement('textarea');
                    t.value = email;
                    t.style.position = 'fixed';
                    t.style.opacity = '0';
                    document.body.appendChild(t);
                    t.select();
                    try { document.execCommand('copy'); done(); } catch (e) {}
                    document.body.removeChild(t);
                }
            });
        });
    </script>

</body>
</html>
