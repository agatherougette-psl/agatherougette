<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Agathe Rougette — Portfolio 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Déclaration de la police personnalisée */
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Mobile par défaut */
        :root {
            --card-w: 150px;
            --card-h: 225px;
            --card-d: 8px;
        }

        @media (min-width: 768px) {
            :root {
                --card-w: 210px;
                --card-h: 310px;
                --card-d: 10px;
            }
        }

        @media (min-width: 1024px) {
            :root {
                --card-w: 240px;
                --card-h: 350px;
                --card-d: 12px;
            }
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ECF244;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }

        .hero-title {
            font-family: 'AchilleusScript', cursive, sans-serif;
            font-size: clamp(2.8rem, 12vw, 7.5rem);
            line-height: 1;
            color: #09090b;
            text-align: center;
            margin: 0;
        }

        .stage-3d {
            perspective: 1400px;
            perspective-origin: 50% 45%;
            width: 100%;
        }

        .shelf-3d {
            transform-style: preserve-3d;
            display: flex !important;
            align-items: flex-end !important;
            justify-content: center !important;
            min-height: 250px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .shelf-3d {
                min-height: 360px;
            }
        }

        .card-item {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), margin 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            margin-left: -70px;
            margin-right: -70px;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .card-3d {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-14deg) rotateX(5deg) rotateZ(1deg);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .face {
            position: absolute;
            backface-visibility: hidden;
        }

        .face-front {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / 2));
            border-radius: 8px;
            overflow: hidden;
            box-shadow: -4px 8px 16px rgba(0, 0, 0, 0.2);
            background-size: cover;
            background-position: center;
        }

        @media (min-width: 768px) {
            .face-front {
                border-radius: 10px;
            }
        }

        .face-back {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / -2)) rotateY(180deg);
            background: #111113;
            border-radius: 10px;
        }

        .face-side-left {
            width: var(--card-d);
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-50%) rotateY(-90deg);
            background: #18181b;
        }

        .face-side-right {
            width: var(--card-d);
            height: 100%;
            right: 0;
            top: 0;
            transform: translateX(50%) rotateY(90deg);
            background: linear-gradient(to right, #111113, #1f1f23);
            box-shadow: inset 1px 0 2px rgba(0, 0, 0, 0.4);
        }

        .face-top {
            width: 100%;
            height: var(--card-d);
            left: 0;
            top: 0;
            transform: translateY(-50%) rotateX(90deg);
            background: #27272a;
        }

        .shadow-floor {
            position: absolute;
            bottom: -16px;
            left: 10%;
            width: 80%;
            height: 14px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 75%);
            filter: blur(5px);
            transform: rotateX(85deg) translateZ(-10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            opacity: 0.8;
        }

        @media (min-width: 768px) {
            .shadow-floor {
                bottom: -22px;
                height: 18px;
                filter: blur(6px);
                transform: rotateX(85deg) translateZ(-15px);
            }
        }

        /* ===== Animation 1 : soulèvement 3D (survol ordi OU tap téléphone) ===== */
        /* Le survol n'est actif que sur les appareils avec souris (évite le "hover collé" sur téléphone) */
        @media (min-width: 768px) {
            .card-item.is-lifted,
            .card-item:hover {
                z-index: 120 !important;
                margin-left: -15px;
                margin-right: -15px;
            }
            .card-item:hover .card-3d,
            .card-item.is-lifted .card-3d {
                transform: translateY(-60px) translateZ(150px) rotateY(-4deg) scale(1.08);
            }
            .card-item:hover .shadow-floor,
            .card-item.is-lifted .shadow-floor {
                transform: rotateX(85deg) translateZ(-45px) scale(1.4);
                opacity: 0.25;
                filter: blur(12px);
            }
        }

        /* ===== MOBILE : étagère à faire glisser au doigt ===== */
        @media (max-width: 767px) {
            .stage-3d {
                perspective: none;
            }

            .shelf-3d {
                justify-content: flex-start !important;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x mandatory;
                scrollbar-width: none;
                gap: 6px;
                /* place en haut pour la carte soulevée, en bas pour l'ombre */
                padding: 50px calc(50vw - var(--card-w) / 2) 36px !important;
                min-height: 0;
                overscroll-behavior-x: contain;
            }
            .shelf-3d::-webkit-scrollbar {
                display: none;
            }

            /* Chaque carte a sa propre perspective (le conteneur scrollable aplatit la 3D) */
            .card-item {
                margin-left: 0;
                margin-right: 0;
                perspective: 900px;
                perspective-origin: 50% 45%;
                scroll-snap-align: center;
            }

            .card-item.is-lifted {
                z-index: 120 !important;
            }
            .card-item.is-lifted .card-3d {
                transform: translateY(-28px) translateZ(40px) rotateY(-4deg) scale(1.06);
            }
            .card-item.is-lifted .shadow-floor {
                transform: rotateX(85deg) translateZ(-30px) scale(1.3);
                opacity: 0.25;
                filter: blur(10px);
            }
        }

        /* ===== Animation 2 & 3 : tilt 3D + ombre au sol (déjà dans .card-3d / .shadow-floor) ===== */

        /* Filtres du bas : défilent horizontalement sur petit écran */
        .filters-bar {
            max-width: 95%;
        }
        @media (max-width: 767px) {
            .filters-bar {
                flex-wrap: nowrap;
                justify-content: flex-start;
                overflow-x: auto;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
            }
            .filters-bar::-webkit-scrollbar {
                display: none;
            }
            .filters-bar > * {
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

        </div>

        <nav class="flex items-center space-x-3 md:space-x-10 text-[9px] md:text-xs font-bold tracking-widest uppercase shrink-0">

            <a href="apropos.html" class="nav-link">À propos</a>
        </nav>

                <a href="DA, Shoot, Retouches.html" class="card-item" style="z-index: 5; display: block; text-decoration: none;">
                    <div class="card-3d">
                        <div class="face face-front" style="background-image: url('projet2.png');">

                    </div>
                    <div class="shadow-floor"></div>
                </a>

                <!-- Livre 3 : Fascicule -->
                <a href="Fascicule.html" class="card-item" style="z-index: 7; display: block; text-decoration: none;">
                    <div class="card-3d">
                        <div class="face face-front" style="background-image: url('projet3.gif');">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 p-3 md:p-5 flex flex-col justify-end text-white">

                <!-- Livre 5 : Extra -->

        <!-- Filtres du bas -->

            <a href="Brief de marque Agatha.html" class="px-2.5 md:px-3 py-1 md:py-1.5 hover:text-[#FA378F] transition-colors inline-block">Brief de marque Agatha</a>
        </div>
    </main>

    <!-- Interaction tactile mobile : 1er tap = la carte se soulève, 2e tap = ouvre le projet -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card-item');
            const isTouchDevice = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches
                || window.matchMedia('(max-width: 767px)').matches;

            cards.forEach(card => {
                card.addEventListener('click', (e) => {
                    if (isTouchDevice() && !card.classList.contains('is-lifted')) {
                        if (card.tagName.toLowerCase() === 'a') {
                            e.preventDefault();
                        }
                        cards.forEach(c => c.classList.remove('is-lifted'));
                        card.classList.add('is-lifted');
                        card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                });
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.card-item')) {
                    cards.forEach(c => c.classList.remove('is-lifted'));
                }
            });

            // Sur mobile, on centre la 1re carte au chargement
            const shelf = document.getElementById('shelf-container');
            if (shelf && window.matchMedia('(max-width: 767px)').matches) {
                shelf.scrollLeft = 0;
            }
        });
    </script>

</body>
</html>
