<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathe Rougette — Portfolio 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Déclaration de la police personnalisée */
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --card-w: 210px;
            --card-h: 310px;
            --card-d: 10px;
        }

        @media (min-width: 1024px) {
            :root {
                --card-w: 240px;
                --card-h: 350px;
                --card-d: 12px;
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ECF244;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
        }

        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F !important;
        }

        .hero-title {
            font-family: 'AchilleusScript', cursive, sans-serif;
            font-size: clamp(3rem, 7vw, 7.5rem);
            line-height: 1;
            color: #09090b;
            text-align: center;
            margin: 0;
        }

        .stage-3d {
            perspective: 1400px;
            perspective-origin: 50% 45%;
            width: 100%;
        }

        .shelf-3d {
            transform-style: preserve-3d;
            display: flex !important;
            align-items: flex-end !important;
            justify-content: center !important;
            min-height: 360px;
            width: 100%;
        }

        .card-item {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), margin 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            margin-left: -70px;
            margin-right: -70px;
            flex-shrink: 0;
        }

        .card-3d {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-14deg) rotateX(5deg) rotateZ(1deg);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .face {
            position: absolute;
            backface-visibility: hidden;
        }

        .face-front {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / 2));
            border-radius: 10px;
            overflow: hidden;
            box-shadow: -4px 8px 16px rgba(0, 0, 0, 0.2);
            background-size: cover;
            background-position: center;
        }

        .face-back {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / -2)) rotateY(180deg);
            background: #111113;
            border-radius: 10px;
        }

        .face-side-left {
            width: var(--card-d);
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-50%) rotateY(-90deg);
            background: #18181b;
        }

        .face-side-right {
            width: var(--card-d);
            height: 100%;
            right: 0;
            top: 0;
            transform: translateX(50%) rotateY(90deg);
            background: linear-gradient(to right, #111113, #1f1f23);
            box-shadow: inset 1px 0 2px rgba(0, 0, 0, 0.4);
        }

        .face-top {
            width: 100%;
            height: var(--card-d);
            left: 0;
            top: 0;
            transform: translateY(-50%) rotateX(90deg);
            background: #27272a;
        }

        .shadow-floor {
            position: absolute;
            bottom: -22px;
            left: 10%;
            width: 80%;
            height: 18px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 75%);
            filter: blur(6px);
            transform: rotateX(85deg) translateZ(-15px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            opacity: 0.8;
        }

        .card-item:hover {
            z-index: 120 !important;
            margin-left: -15px;
            margin-right: -15px;
        }

        .card-item:hover .card-3d {
            transform: translateY(-60px) translateZ(150px) rotateY(-4deg) scale(1.08);
        }

        .card-item:hover .shadow-floor {
            transform: rotateX(85deg) translateZ(-45px) scale(1.4);
            opacity: 0.25;
            filter: blur(12px);
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

                                <span class="text-[10px] font-extrabold uppercase text-[#ECF244]">Projet de Groupe</span>
                                <h4 class="font-bold text-base mt-1">Brief de marque Agatha</h4>
                            </div>
                        </div>
                        <div class="face face-back"></div>
                        <div class="face face-side-left"></div>
                        <div class="face face-side-right"></div>
                        <div class="face face-top"></div>
                    </div>

                </a>

                <!-- Livre 5 : Brief Agatha -->
                <div class="card-item" style="z-index: 4;">
                    <div class="card-3d">

        <!-- Filtres du bas -->
        <div class="flex flex-wrap justify-center gap-3 text-xs font-bold uppercase border border-black/15 py-3 px-6 backdrop-blur-md bg-black/5 rounded-full shadow-md my-2">
            <button class="bg-black text-[#ECF244] px-4 py-1.5 rounded-full">Tous</button>
            <a href="Projet Célene.html" class="px-3 py-1.5 hover:text-[#FA378F] transition-colors inline-block">Projet Célene</a>
            <a href="DA, Shoot, Retouches.html" class="px-3 py-1.5 hover:text-[#FA378F] transition-colors inline-block">DA, Shoot, Retouches</a>
