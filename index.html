<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Agathe Rougette — Portfolio 3D</title>

    <script>document.documentElement.classList.add('js');</script>

    <!-- La police est chargée en priorité (le titre en dépend) -->
    <link rel="preload" href="Achilleus%20Script.otf" as="font" type="font/otf" crossorigin>

    <!-- OPTIMISATION : l'image poster de la vidéo est chargée en priorité,
         elle s'affiche instantanément avant que la vidéo démarre -->
    <link rel="preload" href="projet3-poster.webp" as="image" type="image/webp">

    <!-- Plus de Tailwind CDN sur cette page : tout le style est ci-dessous,
         donc la page s'affiche immédiatement, sans attendre de script externe. -->
    <style>
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        /* ---------- Base (remplace le reset de Tailwind) ---------- */
        *, *::before, *::after { box-sizing: border-box; }
        h1, h4, p { margin: 0; }
        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }
        button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }

        /* Mobile par défaut */
        :root {
            --card-w: 150px;
            --card-h: 225px;
            --card-d: 8px;
        }

        @media (min-width: 768px) {
            :root {
                --card-w: 210px;
                --card-h: 310px;
                --card-d: 10px;
            }
        }

        @media (min-width: 1024px) {
            :root {
                --card-w: 240px;
                --card-h: 350px;
                --card-d: 12px;
            }
        }

        html {
            -webkit-text-size-adjust: 100%;
            line-height: 1.5;
            background-color: #ECF244;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ECF244;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ---------- Header ---------- */
        .site-header {
            position: relative;
            z-index: 50;
            width: 100%;
            padding: 1rem 0.75rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            row-gap: 0.75rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .brand img {
            height: 1.75rem;
            width: auto;
            object-fit: contain;
        }
        .brand span {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .main-nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nav-link {
            transition: color 0.2s ease-in-out;
        }
        .nav-link:hover {
            color: #FA378F;
        }
        .cta {
            display: inline-block;
            flex-shrink: 0;
            padding: 0.5rem 0.75rem;
            border-radius: 9999px;
            background: #000;
            color: #ECF244;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out;
        }
        .cta:hover {
            background: #CC1F6D;
            color: #fff;
        }
        @media (min-width: 640px) {
            .site-header { flex-wrap: nowrap; }
        }
        @media (min-width: 768px) {
            .site-header { padding: 1.5rem 2rem; }
            .brand { gap: 0.75rem; }
            .brand img { height: 2.25rem; }
            .brand span { font-size: 0.875rem; }
            .main-nav { gap: 2.5rem; font-size: 0.75rem; }
            .cta { padding: 0.75rem 1.5rem; font-size: 0.75rem; }
        }

        /* ---------- Contenu ---------- */
        .main {
            flex: 1 1 0%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .hero-title {
            font-family: 'AchilleusScript', cursive, sans-serif;
            font-size: clamp(2.8rem, 12vw, 7.5rem);
            /* Hauteur de ligne généreuse + marge basse : les queues des lettres (g, t, y...)
               de la police script ne sont plus coupées */
            line-height: 1.3;
            color: #09090b;
            text-align: center;
            margin: 0.5rem 0 calc(0.5rem - 0.3em);
            padding: 0.1em 0.75rem 0.25em;
            overflow: visible;
        }
        /* Le titre apparaît en douceur dès que la police est là (pas de saut de police).
           Fondu seulement, sans déplacement : ça évite que le navigateur recadre le texte. */
        .js .hero-title {
            opacity: 0;
        }
        .js.fonts-ready .hero-title {
            opacity: 1;
            transition: opacity 0.6s ease-out;
        }

        .stage-3d {
            perspective: 1400px;
            perspective-origin: 50% 45%;
            width: 100%;
            margin: 0.5rem 0;
        }

        .shelf-3d {
            transform-style: preserve-3d;
            display: flex !important;
            align-items: flex-end !important;
            justify-content: center !important;
            min-height: 250px;
            width: 100%;
            padding: 0 0.5rem;
        }

        @media (min-width: 768px) {
            .stage-3d { margin: 1rem 0; }
            .shelf-3d {
                min-height: 360px;
                padding: 0 1.5rem;
            }
        }

        /* Apparition des cartes : un seul mouvement d'ensemble, en cascade */
        @keyframes rise {
            from { opacity: 0; transform: translateY(28px); }
        }

        .card-item {
            position: relative;
            display: block;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), margin 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            margin-left: -70px;
            margin-right: -70px;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) var(--d, 0s) backwards;
        }

        .card-3d {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-14deg) rotateX(5deg) rotateZ(1deg);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .face {
            position: absolute;
            backface-visibility: hidden;
        }

        .face-front {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / 2));
            border-radius: 8px;
            overflow: hidden;
            box-shadow: -4px 8px 16px rgba(0, 0, 0, 0.2);
            background-color: #18181b; /* fond sombre le temps que l'image arrive */
        }

        @media (min-width: 768px) {
            .face-front {
                border-radius: 10px;
            }
        }

        /* Image de la carte (vraie balise <img> : le navigateur la charge en priorité) */
        .card-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .js .card-img {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
        .js .card-img.is-in {
            opacity: 1;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: #fff;
            background-image: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
        }
        .card-overlay span {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: #ECF244;
        }
        .card-overlay h4 {
            margin-top: 0.125rem;
            font-size: 0.875rem;
            font-weight: 700;
            line-height: 1.25;
        }
        @media (min-width: 768px) {
            .card-overlay { padding: 1.25rem; }
            .card-overlay span { font-size: 10px; }
            .card-overlay h4 { margin-top: 0.25rem; font-size: 1rem; }
        }

        .face-back {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / -2)) rotateY(180deg);
            background: #111113;
            border-radius: 10px;
        }

        .face-side-left {
            width: var(--card-d);
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-50%) rotateY(-90deg);
            background: #18181b;
        }

        .face-side-right {
            width: var(--card-d);
            height: 100%;
            right: 0;
            top: 0;
            transform: translateX(50%) rotateY(90deg);
            background: linear-gradient(to right, #111113, #1f1f23);
            box-shadow: inset 1px 0 2px rgba(0, 0, 0, 0.4);
        }

        .face-top {
            width: 100%;
            height: var(--card-d);
            left: 0;
            top: 0;
            transform: translateY(-50%) rotateX(90deg);
            background: #27272a;
        }

        .shadow-floor {
            position: absolute;
            bottom: -16px;
            left: 10%;
            width: 80%;
            height: 14px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 75%);
            filter: blur(5px);
            transform: rotateX(85deg) translateZ(-10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            opacity: 0.8;
        }

        @media (min-width: 768px) {
            .shadow-floor {
                bottom: -22px;
                height: 18px;
                filter: blur(6px);
                transform: rotateX(85deg) translateZ(-15px);
            }
        }

        /* ===== Animation 1 : soulèvement 3D (survol ordi OU tap téléphone) ===== */
        @media (min-width: 768px) {
            .card-item.is-lifted,
            .card-item:hover {
                z-index: 120 !important;
                margin-left: -15px;
                margin-right: -15px;
            }
            .card-item:hover .card-3d,
            .card-item.is-lifted .card-3d {
                transform: translateY(-60px) translateZ(150px) rotateY(-4deg) scale(1.08);
            }
            .card-item:hover .shadow-floor,
            .card-item.is-lifted .shadow-floor {
                transform: rotateX(85deg) translateZ(-45px) scale(1.4);
                opacity: 0.25;
                filter: blur(12px);
            }
        }

        /* ===== MOBILE : étagère à faire glisser au doigt ===== */
        @media (max-width: 767px) {
            .stage-3d {
                perspective: none;
            }

            .shelf-3d {
                justify-content: flex-start !important;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x mandatory;
                scrollbar-width: none;
                gap: 6px;
                /* place en haut pour la carte soulevée, en bas pour l'ombre */
                padding: 50px calc(50vw - var(--card-w) / 2) 36px !important;
                min-height: 0;
                overscroll-behavior-x: contain;
            }
            .shelf-3d::-webkit-scrollbar {
                display: none;
            }

            /* Chaque carte a sa propre perspective (le conteneur scrollable aplatit la 3D) */
            .card-item {
                margin-left: 0;
                margin-right: 0;
                perspective: 900px;
                perspective-origin: 50% 45%;
                scroll-snap-align: center;
            }

            .card-item.is-lifted {
                z-index: 120 !important;
            }
            .card-item.is-lifted .card-3d {
                transform: translateY(-28px) translateZ(40px) rotateY(-4deg) scale(1.06);
            }
            .card-item.is-lifted .shadow-floor {
                transform: rotateX(85deg) translateZ(-30px) scale(1.3);
                opacity: 0.25;
                filter: blur(10px);
            }
        }

        /* ---------- Filtres du bas ---------- */
        .filters-bar {
            max-width: 95%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.375rem;
            margin: 0.5rem 0 1.25rem;
            padding: 0.625rem 1rem;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 1rem;
            background: rgba(0, 0, 0, 0.05);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        .filter-all {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: #000;
            color: #ECF244;
        }
        .filter-link {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            transition: color 0.2s ease-in-out;
        }
        .filter-link:hover {
            color: #FA378F;
        }
        @media (min-width: 768px) {
            .filters-bar {
                gap: 0.75rem;
                padding: 0.75rem 1.5rem;
                font-size: 0.75rem;
                border-radius: 9999px;
            }
            .filter-all { padding: 0.375rem 1rem; }
            .filter-link { padding: 0.375rem 0.75rem; }
        }
        @media (max-width: 767px) {
            .filters-bar {
                flex-wrap: nowrap;
                justify-content: flex-start;
                overflow-x: auto;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
            }
            .filters-bar::-webkit-scrollbar {
                display: none;
            }
            .filters-bar > * {
                flex-shrink: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card-item { animation: none; }
            .js .hero-title { opacity: 1; }
            .js.fonts-ready .hero-title { transition: none; }
            .js .card-img { transition: none; }
        }
    </style>
</head>

    <!-- Chargement : images en fondu, vidéo lancée immédiatement, pages projets préchargées en dernier -->
    <script>
        (function () {
            const root = document.documentElement;
            let videoStarted = false;
            let pageLoaded = false;

            /* Les images apparaissent en fondu dès qu'elles sont prêtes */
            function show(img) { img.classList.add('is-in'); }
            document.querySelectorAll('.card-img').forEach(function (img) {
                if (img.tagName === 'VIDEO') {
                    /* Vidéo de la carte Fascicule : muette, en boucle, lancée tout de suite.
                       OPTIMISATION : elle est visible immédiatement (le poster s'affiche),
                       on n'attend plus que la vidéo soit chargée. */
                    img.muted = true;
                    img.defaultMuted = true;
                    img.loop = true;
                    img.playsInline = true;

                    show(img);

                    const tryPlay = function () {
                        const p = img.play();
                        if (p && p.catch) p.catch(function () {});
                    };
                    tryPlay();
                    img.addEventListener('canplay', tryPlay, { once: true });
                    img.addEventListener('playing', function () {
                        videoStarted = true;
                        maybePrefetch();
                    }, { once: true });

                    /* Si le navigateur bloque la lecture automatique : le 1er geste de la visiteuse la lance */
                    ['pointerdown', 'touchstart', 'scroll', 'keydown'].forEach(function (ev) {
                        window.addEventListener(ev, function onFirst() {
                            window.removeEventListener(ev, onFirst);
                            if (img.paused) tryPlay();
                        }, { passive: true });
                    });
                    return;
                }
                if (img.complete && img.naturalWidth) show(img);
                else {
                    img.addEventListener('load', function () { show(img); });
                    img.addEventListener('error', function () { show(img); });
                }
            });

            /* Le titre attend la police pour apparaître (plus de changement de police visible) */
            function showTitle() { root.classList.add('fonts-ready'); }
            if (document.fonts && document.fonts.load) {
                document.fonts.load('1em AchilleusScript').then(showTitle, showTitle);
                setTimeout(showTitle, 1500);               // sécurité
            } else {
                showTitle();
            }

            /* On précharge les pages projets en arrière-plan, mais seulement quand la vidéo
               tourne déjà (ou après 4 s), pour ne pas ralentir son démarrage */
            function prefetchPages() {
                const conn = navigator.connection;
                if (conn && conn.saveData) return;         // on respecte le mode économie de données
                document.querySelectorAll('a.card-item[href]').forEach(function (a) {
                    const l = document.createElement('link');
                    l.rel = 'prefetch';
                    l.href = a.href;
                    document.head.appendChild(l);
                });
            }

            let prefetched = false;
            function maybePrefetch() {
                if (prefetched || !pageLoaded || !videoStarted) return;
                prefetched = true;
                (window.requestIdleCallback || function (fn) { setTimeout(fn, 500); })(prefetchPages);
            }

            function afterLoad() {
                pageLoaded = true;
                maybePrefetch();
                setTimeout(function () {                   // sécurité : si la vidéo ne démarre pas
                    videoStarted = true;
                    maybePrefetch();
                }, 4000);
            }
            if (document.readyState === 'complete') afterLoad();
            else window.addEventListener('load', afterLoad);
        })();
    </script>

    <!-- Interaction tactile mobile : 1er tap = la carte se soulève, 2e tap = ouvre le projet -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card-item');
            const isTouchDevice = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches
                || window.matchMedia('(max-width: 767px)').matches;

            cards.forEach(card => {
                card.addEventListener('click', (e) => {
                    if (isTouchDevice() && !card.classList.contains('is-lifted')) {
                        if (card.tagName.toLowerCase() === 'a') {
                            e.preventDefault();
                        }
                        cards.forEach(c => c.classList.remove('is-lifted'));
                        card.classList.add('is-lifted');
                        card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                });
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.card-item')) {
                    cards.forEach(c => c.classList.remove('is-lifted'));
                }
            });

            // Sur mobile, on centre la 1re carte au chargement
            const shelf = document.getElementById('shelf-container');
            if (shelf && window.matchMedia('(max-width: 767px)').matches) {
                shelf.scrollLeft = 0;
            }
        });
    </script>

</body>
</html>
