<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathe Rougette — Portfolio 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Déclaration de la police personnalisée */
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --card-w: 210px;
            --card-h: 310px;
            --card-d: 18px;
        }

        @media (min-width: 1024px) {
            :root {
                --card-w: 240px;
                --card-h: 350px;
                --card-d: 20px;
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ECF244;
            color: #09090b;
            font-family: sans-serif;
            min-height: 100vh;
        }

        /* Grand Titre avec la police Achilleus Script */
        .hero-title {
            font-family: 'AchilleusScript', cursive, sans-serif;
            font-size: clamp(3rem, 7vw, 7.5rem);
            line-height: 1;
            color: #09090b;
            text-align: center;
            margin: 0;
        }

        /* Scène 3D */
        .stage-3d {
            perspective: 1400px;
            perspective-origin: 50% 45%;
            width: 100%;
        }

        .shelf-3d {
            transform-style: preserve-3d;
            display: flex !important;
            align-items: flex-end !important;
            justify-content: center !important;
            min-height: 360px;
            width: 100%;
        }

        .card-item {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease, margin 0.4s ease;
            cursor: pointer;
            margin-left: -85px;
            margin-right: -85px;
            flex-shrink: 0;
        }

        .card-3d {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-36deg) rotateX(10deg) rotateZ(2deg);
            transition: transform 0.4s ease;
        }

        .face {
            position: absolute;
            backface-visibility: hidden;
        }

        .face-front {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / 2));
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }

        .face-back {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / -2)) rotateY(180deg);
            background: #09090b;
            border-radius: 12px;
        }

        .face-side-left {
            width: var(--card-d);
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-50%) rotateY(-90deg);
            background: #18181b;
        }

        .face-side-right {
            width: var(--card-d);
            height: 100%;
            right: 0;
            top: 0;
            transform: translateX(50%) rotateY(90deg);
            background: #27272a;
        }

        .face-top {
            width: 100%;
            height: var(--card-d);
            left: 0;
            top: 0;
            transform: translateY(-50%) rotateX(90deg);
            background: #3f3f46;
        }

        .shadow-floor {
            position: absolute;
            bottom: -30px;
            left: 5%;
            width: 90%;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 75%);
            transform: rotateX(80deg) translateZ(-20px);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        /* Hover */
        .card-item:hover {
            z-index: 120 !important;
            margin-left: -15px;
            margin-right: -15px;
        }

        .card-item:hover .card-3d {
            transform: translateY(-60px) translateZ(150px) rotateY(-10deg) scale(1.1);
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen">

    <!-- Header Navigation -->
    <header class="w-full px-8 py-6 flex items-center justify-between z-50">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-black text-[#ECF244] flex items-center justify-center font-bold text-xl rounded-full">
                AR
            </div>
            <span class="font-bold text-sm tracking-widest uppercase">Portfolio</span>
        </div>

        <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-widest uppercase">
            <a href="#" class="hover:opacity-75">Projets</a>
            <a href="#" class="hover:opacity-75">À propos</a>
            <a href="#" class="hover:opacity-75">Galerie</a>
            <a href="#" class="hover:opacity-75">Contact</a>
        </nav>

        <button class="bg-black text-[#ECF244] text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-full shadow-lg">
            Me contacter
        </button>
    </header>

    <!-- Content -->
    <main class="flex-1 flex flex-col items-center justify-between py-4">
        
        <!-- Titre Agathe Rougette -->
        <h1 class="hero-title my-2">Agathe Rougette</h1>

        <!-- Stage 3D -->
        <div class="stage-3d my-4">
            <div id="shelf-container" class="shelf-3d px-6">
                <!-- Directement écrit en HTML fixe pour garantir l'affichage -->
                <div class="card-item" style="z-index: 4;">
                    <div class="card-3d">
                        <div class="face face-front" style="background-image: url('projet1.png'); background-size: cover; background-position: center;">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 p-5 flex flex-col justify-end text-white">
                                <span class="text-[10px] font-extrabold uppercase text-[#ECF244]">Projet Célene</span>
                                <h4 class="font-bold text-base mt-1">Studio Vision</h4>
                            </div>
                        </div>
                        <div class="face face-back"></div>
                        <div class="face face-side-left"></div>
                        <div class="face face-side-right"></div>
                        <div class="face face-top"></div>
                    </div>
                    <div class="shadow-floor"></div>
                </div>

                <div class="card-item" style="z-index: 5;">
                    <div class="card-3d">
                        <div class="face face-front" style="background: linear-gradient(135deg, #000000, #434343);">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 p-5 flex flex-col justify-end text-white">
                                <span class="text-[10px] font-extrabold uppercase text-[#ECF244]">Photographie</span>
                                <h4 class="font-bold text-base mt-1">Lumière Noire</h4>
                            </div>
                        </div>
                        <div class="face face-back"></div>
                        <div class="face face-side-left"></div>
                        <div class="face face-side-right"></div>
                        <div class="face face-top"></div>
                    </div>
                    <div class="shadow-floor"></div>
                </div>

                <div class="card-item" style="z-index: 7;">
                    <div class="card-3d">
                        <div class="face face-front" style="background: linear-gradient(135deg, #11998e, #38ef7d);">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 p-5 flex flex-col justify-end text-white">
                                <span class="text-[10px] font-extrabold uppercase text-[#ECF244]">Art Direction</span>
                                <h4 class="font-bold text-base mt-1">Écho Organique</h4>
                            </div>
                        </div>
                        <div class="face face-back"></div>
                        <div class="face face-side-left"></div>
                        <div class="face face-side-right"></div>
                        <div class="face face-top"></div>
                    </div>
                    <div class="shadow-floor"></div>
                </div>

                <div class="card-item" style="z-index: 5;">
                    <div class="card-3d">
                        <div class="face face-front" style="background: linear-gradient(135deg, #8e2de2, #4a00e0);">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 p-5 flex flex-col justify-end text-white">
                                <span class="text-[10px] font-extrabold uppercase text-[#ECF244]">Branding</span>
                                <h4 class="font-bold text-base mt-1">Formes & Volumes</h4>
                            </div>
                        </div>
                        <div class="face face-back"></div>
                        <div class="face face-side-left"></div>
                        <div class="face face-side-right"></div>
                        <div class="face face-top"></div>
                    </div>
                    <div class="shadow-floor"></div>
                </div>

                <div class="card-item" style="z-index: 4;">
                    <div class="card-3d">
                        <div class="face face-front" style="background: linear-gradient(135deg, #d4145a, #fbb03b);">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 p-5 flex flex-col justify-end text-white">
                                <span class="text-[10px] font-extrabold uppercase text-[#ECF244]">Design</span>
                                <h4 class="font-bold text-base mt-1">Matière Brut</h4>
                            </div>
                        </div>
                        <div class="face face-back"></div>
                        <div class="face face-side-left"></div>
                        <div class="face face-side-right"></div>
                        <div class="face face-top"></div>
                    </div>
                    <div class="shadow-floor"></div>
                </div>
            </div>
        </div>

        <!-- Filtres du bas -->
        <div class="flex flex-wrap justify-center gap-3 text-xs font-bold uppercase border border-black/15 py-3 px-6 backdrop-blur-md bg-black/5 rounded-full shadow-md my-2">
            <button class="bg-black text-[#ECF244] px-4 py-1.5 rounded-full">Tous</button>
            <button class="px-3 py-1.5 hover:opacity-75">Design</button>
            <button class="px-3 py-1.5 hover:opacity-75">Photographie</button>
            <button class="px-3 py-1.5 hover:opacity-75">Art Direction</button>
            <button class="px-3 py-1.5 hover:opacity-75">Branding</button>
        </div>
    </main>

</body>
</html>
