<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathe Rougette — Portfolio 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#ECF244'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        custom: ['AchilleusScript', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Déclaration de votre police personnalisée */
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --card-w: 220px;
            --card-h: 330px;
            --card-d: 16px;
        }

        @media (min-width: 1024px) {
            :root {
                --card-w: 250px;
                --card-h: 375px;
                --card-d: 20px;
            }
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: auto;
            background-color: #ECF244;
            color: #09090b;
            font-family: 'Inter', sans-serif;
        }

        /* 3D Stage setup */
        .stage-3d {
            perspective: 1400px;
            perspective-origin: 50% 45%;
        }

        .shelf-3d {
            transform-style: preserve-3d;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Container per card in the fan layout */
        .card-item {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.3, 1), margin 0.5s ease;
            cursor: pointer;
            margin-left: -90px;
            margin-right: -90px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .card-item {
                margin-left: -110px;
                margin-right: -110px;
            }
        }

        /* Sleek 3D Slab / Card Element */
        .card-3d {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-36deg) rotateX(10deg) rotateZ(2deg);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        /* Faces for sleek slab depth */
        .face {
            position: absolute;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .face-front {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / 2));
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            background-size: cover;
            background-position: center;
        }

        .face-back {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / -2)) rotateY(180deg);
            background: #09090b;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .face-side-left {
            width: var(--card-d);
            height: 100%;
            left: 0;
            top: 0;
            transform: translateX(-50%) rotateY(-90deg);
            background: #18181b;
            border-radius: 2px;
        }

        .face-side-right {
            width: var(--card-d);
            height: 100%;
            right: 0;
            top: 0;
            transform: translateX(50%) rotateY(90deg);
            background: #27272a;
            border-radius: 2px;
        }

        .face-top {
            width: 100%;
            height: var(--card-d);
            left: 0;
            top: 0;
            transform: translateY(-50%) rotateX(90deg);
            background: #3f3f46;
            border-radius: 2px;
        }

        /* Floor Shadow under each 3D Slab */
        .shadow-floor {
            position: absolute;
            bottom: -35px;
            left: 5%;
            width: 90%;
            height: 35px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0) 75%);
            transform: rotateX(80deg) translateZ(-20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        /* --- HOVER ANIMATION: ELEVATE + CENTER --- */
        .card-item:hover {
            z-index: 120 !important;
            margin-left: -20px;
            margin-right: -20px;
        }

        .card-item:hover .card-3d {
            transform: translateY(-80px) translateZ(180px) rotateY(-12deg) rotateX(4deg) rotateZ(0deg) scale(1.15);
        }

        .card-item:hover .shadow-floor {
            transform: rotateX(80deg) translateZ(-60px) scale(1.6);
            opacity: 0.25;
            filter: blur(8px);
        }

        /* Grand titre avec la police personnalisée */
        .hero-title {
            font-family: 'AchilleusScript', cursive, sans-serif;
            font-size: clamp(2.5rem, 5vw, 5rem);
            line-height: 0.8;
            letter-spacing: -0.01em;
            color: #09090b;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body class="min-h-screen w-screen flex flex-col justify-between relative selection:bg-black selection:text-[#ECF244]">

    <!-- Header Navigation -->
    <header class="relative z-50 w-full px-8 py-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-black text-[#ECF244] flex items-center justify-center font-serif font-black text-xl rounded-full shadow-md">
                AR
            </div>
            <span class="font-bold text-sm tracking-widest uppercase text-black">Portfolio</span>
        </div>

        <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-widest uppercase text-black/80">
            <a href="#" class="hover:text-black transition-colors">Projets</a>
            <a href="#" class="hover:text-black transition-colors">À propos</a>
            <a href="#" class="hover:text-black transition-colors">Galerie</a>
            <a href="#" class="hover:text-black transition-colors">Contact</a>
        </nav>

        <button class="bg-black text-[#ECF244] hover:bg-zinc-900 text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-full shadow-xl transition-transform hover:scale-105">
            Me contacter
        </button>
    </header>

    <!-- Section principale -->
    <main class="relative z-10 w-full flex-1 flex flex-col items-center justify-center py-6">
        
        <!-- Grand Titre Agathe Rougette -->
        <div class="w-full flex items-center justify-center z-20 my-4">
            <h1 class="hero-title">Agathe Rougette</h1>
        </div>

        <!-- 3D Carousel Stage -->
        <div class="w-full max-w-7xl mx-auto stage-3d py-6">
            <div id="shelf-container" class="shelf-3d px-6">
                <!-- Cards injected via JS -->
            </div>
        </div>

        <!-- Category Menu Bottom Bar -->
        <div class="z-30 flex flex-wrap justify-center items-center gap-4 text-xs font-bold uppercase tracking-wider border border-black/15 py-3.5 px-8 backdrop-blur-md bg-black/5 text-black rounded-full shadow-lg mt-4">
            <button onclick="filterCategory('all', this)" class="cat-btn bg-black text-[#ECF244] px-4 py-1.5 rounded-full">Tous</button>
            <button onclick="filterCategory('design', this)" class="cat-btn hover:opacity-75 transition-opacity px-2 py-1.5">Design</button>
            <button onclick="filterCategory('photo', this)" class="cat-btn hover:opacity-75 transition-opacity px-2 py-1.5">Photographie</button>
            <button onclick="filterCategory('art', this)" class="cat-btn hover:opacity-75 transition-opacity px-2 py-1.5">Art Direction</button>
            <button onclick="filterCategory('branding', this)" class="cat-btn hover:opacity-75 transition-opacity px-2 py-1.5">Branding</button>
        </div>
    </main>

    <!-- Modal d'inspection -->
    <div id="card-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div id="modal-content" class="bg-black text-white rounded-3xl max-w-2xl w-full p-8 relative shadow-2xl flex flex-col md:flex-row gap-8 transform scale-95 transition-transform duration-300">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-zinc-400 hover:text-white p-2">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <div class="w-52 h-72 flex-shrink-0 mx-auto rounded-xl overflow-hidden shadow-2xl border border-zinc-800">
                <img id="modal-img" src="" class="w-full h-full object-cover" alt="Project Image">
            </div>

            <div class="flex-1 flex flex-col justify-between">
                <div>
                    <span id="modal-category" class
