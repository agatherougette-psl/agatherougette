<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathe Rougette — Portfolio 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#ECF244'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        custom: ['AchilleusScript', 'cursive', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Déclaration de votre police personnalisée */
        @font-face {
            font-family: 'AchilleusScript';
            src: url('Achilleus Script.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --card-w: 200px;
            --card-h: 300px;
            --card-d: 18px;
        }

        @media (min-width: 1024px) {
            :root {
                --card-w: 230px;
                --card-h: 345px;
                --card-d: 20px;
            }
        }

        html, body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #ECF244;
            color: #09090b;
            font-family: 'Inter', sans-serif;
        }

        /* 3D Stage setup */
        .stage-3d {
            perspective: 1400px;
            perspective-origin: 50% 45%;
        }

        .shelf-3d {
            transform-style: preserve-3d;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: calc(var(--card-h) + 40px);
        }

        /* Container per card in the fan layout */
        .card-item {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.3, 1), margin 0.5s ease;
            cursor: pointer;
            margin-left: -85px;
            margin-right: -85px;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .card-item {
                margin-left: -105px;
                margin-right: -105px;
            }
        }

        /* Sleek 3D Slab / Card Element */
        .card-3d {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-36deg) rotateX(10deg) rotateZ(2deg);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        /* Faces for sleek slab depth */
        .face {
            position: absolute;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .face-front {
            width: 100%;
            height: 100%;
            transform: translateZ(calc(var(--card-d) / 2));
            border-radius: 12px;
            overflow: hidden;
